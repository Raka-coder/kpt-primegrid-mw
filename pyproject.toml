[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "primegrid"
version = "0.1.0"
description = "Master-worker gRPC prime-counting system"
requires-python = ">=3.10"
dependencies = [
  "grpcio==1.85.1",
  "grpcio-tools==1.85.1",
  "protobuf==7.36.2",
]

[project.scripts]
primegrid-master = "primegrid.master.__main__:main"
primegrid-worker = "primegrid.worker.__main__:main"
primegrid-client = "primegrid.client.cli:main"
primegrid-bench = "primegrid.client.benchmark:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not slow'"
markers = [
  "slow: integration or benchmark-style tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "src/primegrid/primegrid_pb2.py",
  "src/primegrid/primegrid_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "G"]

[tool.ruff.lint.per-file-ignores]
"src/primegrid/client/benchmark.py" = ["SIM115"]
